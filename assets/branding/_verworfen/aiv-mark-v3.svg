    <use href="#hornL3" />
    <use href="#browL3" />
    <use href="#eyeL3" />
    <use href="#hatchCheekL3" />
    <use href="#hatchJawL3" />
  </g>

  <!-- Stirn-Ornament zwischen den Hoernern -->
  <path class="ink" stroke-width="6" d="M500,228 L 478,262 L 500,296 L 522,262 Z" />
  <path class="ink" stroke-width="4" d="M500,246 L 500,278" />

  <!-- Mitte: Nase, Mund, Kinn-Schatten -->
  <path class="ink" stroke-width="8" d="M500,352 L 500,486" />
  <path class="ink" stroke-width="6" d="M500,486 C 478,500 466,514 470,528" />
  <path class="ink" stroke-width="6" d="M500,486 C 522,500 534,514 530,528" />

  <path class="ink" stroke-width="10" d="M420,606 C 456,624 544,624 580,606" />
  <path class="ink" stroke-width="6" d="M420,606 C 410,596 406,588 410,580" />
  <path class="ink" stroke-width="6" d="M580,606 C 590,596 594,588 590,580" />

  <path class="ink" stroke-width="5" d="M458,668 L 480,694" />
  <path class="ink" stroke-width="5" d="M500,676 L 500,704" />
  <path class="ink" stroke-width="5" d="M542,668 L 520,694" />
