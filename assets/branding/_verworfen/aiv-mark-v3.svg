<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="AIV Erkennungszeichen: Teufelskopf, ornamentale Variante">
  <style>
    :root { --aiv-color: #8B1A1A; }
    .ink { stroke: var(--aiv-color, currentColor); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ink-fill { fill: var(--aiv-color, currentColor); stroke: none; }
  </style>

  <defs>
    <g id="hornL3">
      <path class="ink" stroke-width="9"
        d="M438,234
           C 392,168 332,116 258,90
           C 280,118 288,146 278,172
           C 320,168 366,190 404,228 Z" />
      <path class="ink" stroke-width="5" d="M322,158 C 350,176 374,198 392,220" />
      <path class="ink" stroke-width="5" d="M296,130 C 316,144 334,160 348,178" />
    </g>

    <g id="browL3">
      <path class="ink" stroke-width="13" d="M364,338 C 392,306 428,290 464,296" />
      <path class="ink" stroke-width="5" d="M372,352 C 398,326 428,312 456,314" />
    </g>

    <g id="eyeL3">
      <path class="ink" stroke-width="8" d="M386,392 C 412,364 442,360 468,372" />
      <path class="ink" stroke-width="6" d="M386,392 C 410,410 442,410 468,372" />
      <circle class="ink-fill" cx="434" cy="386" r="9" />
    </g>

    <g id="hatchCheekL3">
      <path class="ink" stroke-width="5" d="M368,460 L 404,486" />
      <path class="ink" stroke-width="5" d="M362,486 L 398,512" />
      <path class="ink" stroke-width="5" d="M356,512 L 392,538" />
      <path class="ink" stroke-width="5" d="M354,538 L 388,562" />
      <path class="ink" stroke-width="5" d="M356,562 L 388,584" />
    </g>

    <g id="hatchJawL3">
      <path class="ink" stroke-width="5" d="M388,700 L 420,720" />
      <path class="ink" stroke-width="5" d="M404,724 L 434,742" />
    </g>
  </defs>

  <!-- Kopf-Silhouette -->
  <g>
    <path class="ink" stroke-width="10"
      d="M500,208
         C 452,206 412,222 388,258
         C 366,292 358,332 366,372
         C 350,410 344,452 356,492
         C 344,538 352,584 380,620
         C 372,662 386,704 418,732
         C 432,762 460,796 500,842" />
    <use href="#hornL3" />
    <use href="#browL3" />
    <use href="#eyeL3" />
    <use href="#hatchCheekL3" />
    <use href="#hatchJawL3" />
  </g>
  <g transform="translate(1000,0) scale(-1,1)">
    <path class="ink" stroke-width="10"
      d="M500,208
         C 452,206 412,222 388,258
         C 366,292 358,332 366,372
         C 350,410 344,452 356,492
         C 344,538 352,584 380,620
         C 372,662 386,704 418,732
